<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI for Contractors - Your complete resource hub for AI automation, tools, and strategies designed specifically for construction and contracting professionals." />
    <title>AI for Contractors - Automation Tools & Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Oswald', 'sans-serif'],
            },
            colors: {
              'brand-orange': '#FF6B35',
              'brand-blue': '#1E40AF',
              'brand-yellow': '#FBBF24',
              'dark-bg': '#1a1a1a',
              'darker-bg': '#121212',
            },
            animation: {
              'subtle-pulse': 'subtle-pulse 4s infinite ease-in-out',
              'fade-in': 'fade-in 0.3s ease-out',
              'scale-up': 'scale-up 0.3s ease-out',
            },
            keyframes: {
              'subtle-pulse': {
                '0%, 100%': { opacity: 0.7 },
                '50%': { opacity: 1 },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'scale-up': {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>

}
</script>
